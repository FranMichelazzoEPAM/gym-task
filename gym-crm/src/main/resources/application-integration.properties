server.port=${GYM_CRM_PORT:18080}

spring.datasource.url=jdbc:h2:file:${GYM_INTEGRATION_DB_PATH};AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=${GYM_JWT_SECRET:gym-crm-integration-test-secret-key-at-least-32}
jwt.expiration=3600000

spring.cloud.discovery.enabled=false
eureka.client.enabled=false
spring.cloud.openfeign.client.config.trainer-workload-service.url=${WORKLOAD_SERVICE_URL:http://localhost:18081}

spring.activemq.broker-url=${ACTIVEMQ_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
spring.activemq.pool.enabled=false

trainer-workload-service.jwt.secret=${WORKLOAD_JWT_SECRET:gym-workload-integration-secret-key-at-least-32}
trainer-workload-service.jwt.expiration=300000
app.messaging.trainer-workload-queue=${WORKLOAD_QUEUE:trainer.workload.integration}
app.messaging.trainer-workload-invalid-dlq=${WORKLOAD_DLQ:trainer.workload.invalid.integration}
