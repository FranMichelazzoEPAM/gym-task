spring.datasource.url=jdbc:h2:mem:gym_component_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=component-test-secret-key-at-least-32-characters
trainer-workload-service.jwt.secret=component-test-workload-secret-at-least-32
trainer-workload-service.jwt.expiration=300000

spring.cloud.discovery.enabled=false
eureka.client.enabled=false
