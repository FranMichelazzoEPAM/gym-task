server:
    port: 8081

spring:
  application:
    name: trainer-workload-service
  activemq:
    broker-url: "tcp://localhost:61616?jms.redeliveryPolicy.maximumRedeliveries=3&jms.redeliveryPolicy.initialRedeliveryDelay=1000&jms.redeliveryPolicy.redeliveryDelay=2000&jms.redeliveryPolicy.useExponentialBackOff=true&jms.redeliveryPolicy.backOffMultiplier=2"
    user: admin
    password: admin
    pool:
      enabled: true
      max-connections: 10

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  security:
    jwt:
      secret: "M3JtEzwIGqzdmNz05lxIiTXQfWRqZO85bFPhDUGIWBw="
  messaging:
    trainer-workload-queue: trainer.workload.queue
    trainer-workload-invalid-dlq: trainer.workload.invalid.dlq

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{transactionId}] %-5level %logger{36} - %msg%n"
