spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongo:27017/trainer-workload-service-docker}
      auto-index-creation: false
  activemq:
    broker-url: ${ACTIVEMQ_URL:tcp://activemq:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
