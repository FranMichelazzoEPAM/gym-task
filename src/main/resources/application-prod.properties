spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gymdb}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Should be provided as environment variable in production
spring.datasource.username=${DB_USERNAME:gymuser}
spring.datasource.password=${DB_PASSWORD:gympass123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=never

jwt.secret=${JWT_SECRET}
jwt.expiration=900000